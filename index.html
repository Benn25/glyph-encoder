<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glyphbreak</title>
<style>
  :root{
    --bg:#0c0e14; --panel:#141823; --panel-2:#0f131c;
    --ink:#e8eaf0; --muted:#717a90; --line:#222838;
    --amber:#f2a65a; --teal:#5ad1c5; --teal-dim:#2c5650;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{padding:16px 18px 4px}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
  .brand h1 .b{color:var(--amber)}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
  main{flex:1;display:flex;flex-direction:column;gap:11px;padding:8px 14px 14px;min-height:0}

  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  textarea{flex:1;width:100%;resize:none;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;padding:13px;outline:none;min-height:72px}
  textarea:focus{border-color:var(--amber)}

  .out-wrap{position:relative;flex:1;min-height:100px}
  #out{height:100%;width:100%;border-radius:12px;border:1px solid var(--teal-dim);
    background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(90,209,197,.025) 3px,rgba(90,209,197,.025) 4px),var(--panel-2);
    color:var(--ink);font-family:var(--mono);font-size:17px;line-height:1.7;
    padding:13px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    box-shadow:inset 0 0 24px rgba(90,209,197,.05)}
  #out:empty::before{content:"encoded output appears here";color:var(--muted);font-style:italic}

  .grp{display:flex;gap:7px}
  .seg{flex:1;font-family:var(--mono);font-size:13px;letter-spacing:.03em;
    padding:10px 6px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-weight:700;cursor:pointer;transition:all .12s}
  .seg small{display:block;font-weight:400;font-size:10px;letter-spacing:.02em;margin-top:2px;opacity:.8}
  .seg[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:#1b1812;box-shadow:0 0 0 1px var(--amber) inset}
  .seg.tealsel[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:#0e1c1a;box-shadow:0 0 0 1px var(--teal) inset}

  .lblrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:1px 2px}

  .row{display:flex;gap:7px;align-items:stretch}
  .btn{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.03em;
    padding:13px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;transition:all .12s;
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.primary{flex:1;background:var(--teal);color:#06201d;border-color:var(--teal)}
  .btn.ghost{flex:1}
  .btn.copied{background:var(--amber);border-color:var(--amber);color:#1a1206}

  .toggle{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;user-select:none;
    padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .sw{width:32px;height:19px;border-radius:10px;background:var(--line);position:relative;transition:background .15s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:all .15s}
  .toggle[aria-pressed="true"] .sw{background:var(--teal-dim)}
  .toggle[aria-pressed="true"] .sw::after{left:15px;background:var(--teal)}
  .toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--teal-dim)}

  .hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.5;padding:2px 4px 2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Glyph<span class="b">break</span></h1><span class="tag">// readable to you, noise to a model</span></div>
</header>

<main>
  <div class="field">
    <div class="label"><span>Plain text</span><span id="incount">0</span></div>
    <textarea id="in" placeholder="Type your message…" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
  </div>

  <div class="grp" role="group" aria-label="Encoding strength">
    <button class="seg" data-lvl="1" aria-pressed="false">L1<small>light</small></button>
    <button class="seg" data-lvl="2" aria-pressed="false">L2<small>medium</small></button>
    <button class="seg" data-lvl="3" aria-pressed="true">L3<small>hardcore</small></button>
  </div>

  <div class="field">
    <div class="label"><span>Encoded</span></div>
    <div class="out-wrap"><div id="out"></div></div>
  </div>

  <div class="lblrow">Invisible splits — hidden characters, stacks on top</div>
  <div class="grp" role="group" aria-label="Invisible splits">
    <button class="seg tealsel" data-zw="0.15" aria-pressed="false">15%</button>
    <button class="seg tealsel" data-zw="0.33" aria-pressed="false">33%</button>
    <button class="seg tealsel" data-zw="0.66" aria-pressed="false">66%</button>
  </div>

  <div class="row">
    <button class="toggle" id="live" aria-pressed="true"><span class="sw"></span>live preview</button>
    <button class="toggle" id="usc" aria-pressed="false"><span class="sw"></span>spaces → _</button>
  </div>

  <div class="row">
    <button class="btn ghost" id="vary">↻ Variation</button>
    <button class="btn ghost" id="encode">Encode</button>
  </div>
  <div class="row"><button class="btn primary" id="copy">Copy result</button></div>
  <div class="hint">↻ Variation = same text, fresh disguise. Invisible splits hit hardest but some apps strip them on paste.</div>
</main>

<script>
/* ---------- glyph engine ---------- */
const MATH = {
  bold:        { up:0x1D400, lo:0x1D41A, holes:{} },
  italic:      { up:0x1D434, lo:0x1D44E, holes:{ h:'\u210E' } },
  script:      { up:0x1D49C, lo:0x1D4B6, holes:{
                  B:'\u212C',E:'\u2130',F:'\u2131',H:'\u210B',I:'\u2110',
                  L:'\u2112',M:'\u2133',R:'\u211B', e:'\u212F',g:'\u210A',o:'\u2134' } },
  boldScript:  { up:0x1D4D0, lo:0x1D4EA, holes:{} },
  fraktur:     { up:0x1D504, lo:0x1D51E, holes:{
                  C:'\u212D',H:'\u210C',I:'\u2111',R:'\u211C',Z:'\u2128' } },
  doubleStruck:{ up:0x1D538, lo:0x1D552, holes:{
                  C:'\u2102',H:'\u210D',N:'\u2115',P:'\u2119',Q:'\u211A',
                  R:'\u211D',Z:'\u2124' } },
  sans:        { up:0x1D5A0, lo:0x1D5BA, holes:{} },
  sansBold:    { up:0x1D5D4, lo:0x1D5EE, holes:{} },
  mono:        { up:0x1D670, lo:0x1D68A, holes:{} },
};
function mathGlyph(ch, k){
  const s = MATH[k];
  if (s.holes[ch]) return s.holes[ch];
  const up = ch>='A'&&ch<='Z', lo = ch>='a'&&ch<='z';
  if(!up && !lo) return null;
  return String.fromCodePoint((up?s.up:s.lo) + ch.charCodeAt(0) - (up?65:97));
}
// cross-script look-alikes — visually near-identical, different codepoints
const HOMO = {
  a:['а','ɑ'], c:['с','ϲ'], e:['е','ё'], g:['ɡ'], h:['һ'], i:['і','ı'],
  j:['ј'], k:['κ'], n:['ո'], o:['о','ο'], p:['р','ρ'], s:['ѕ'],
  u:['υ','ս'], v:['ν','ѵ'], w:['ѡ','ԝ'], x:['х','χ'], y:['у','γ'],
  A:['Α','А'], B:['Β','В'], C:['С','Ϲ'], E:['Ε','Е'], H:['Η','Н'],
  I:['Ι','І'], K:['Κ','К'], M:['Μ','М'], N:['Ν'], O:['Ο','О'],
  P:['Ρ','Р'], T:['Τ','Т'], X:['Χ','Х'], Y:['Υ','У'], Z:['Ζ'],
};
// L1: featherweight, only iconic swaps, mostly off
const L1_SWAP = { a:'@', e:'3', o:'0', i:'1', s:'$' };
// L2: readable leet only (no weird symbols)
const L2_LEET = { a:['@','4'], b:['8'], e:['3'], g:['9'], i:['1','!'],
                  l:['1'], o:['0'], s:['5','$'], t:['7'], z:['2'] };
// L3 in-word breaks: tiny dots only, rare. L2: tinier + rarer.
const INWORD = { 2:{prob:0.04, set:['\u00B7']}, 3:{prob:0.10, set:['\u00B7','\u2027','\u30FB']} };
// L3 punctuation → fullwidth / CJK variants
const PUNCT_VARIANT = {
  '.':['\u3002','\uFF0E'], ',':['\uFF0C'], '?':['\uFF1F'], '!':['\uFF01'],
  ':':['\uFF1A'], ';':['\uFF1B'], '(':['\uFF08'], ')':['\uFF09'],
  '-':['\uFF0D'], "'":['\u2019','\uFF07'], '"':['\u201D','\uFF02'],
};
const ZW = ['\u200B','\u200C','\u200D']; // ZWSP, ZWNJ, ZWJ
function fullwidth(ch){
  if(ch>='A'&&ch<='Z') return String.fromCodePoint(0xFF21+ch.charCodeAt(0)-65);
  if(ch>='a'&&ch<='z') return String.fromCodePoint(0xFF41+ch.charCodeAt(0)-97);
  return null;
}
function poolFor(ch, level){
  const low = ch.toLowerCase();
  const isL = (ch>='a'&&ch<='z')||(ch>='A'&&ch<='Z');
  if(!isL) return null;
  if(level===1){ const g=L1_SWAP[low]; return g ? [ch,ch,ch,ch,g] : null; } // ~80% plain
  if(level===2){
    const out=[ch,ch];
    (L2_LEET[low]||[]).forEach(x=>out.push(x));
    const fw=fullwidth(ch); if(fw) out.push(fw);
    return out;
  }
  const out=[];                                   // L3: only the readable families
  for(const k in MATH){ const g=mathGlyph(ch,k); if(g) out.push(g); }
  (HOMO[ch]||[]).forEach(x=>out.push(x));
  const fw=fullwidth(ch); if(fw) out.push(fw);
  return out.length ? out : null;
}
function rngAt(seed,i){
  let t=(seed^(i*0x9E3779B1))>>>0;
  return function(){ t|=0; t=(t+0x6D2B79F5)|0;
    let r=Math.imul(t^(t>>>15),1|t); r=(r+Math.imul(r^(r>>>7),61|r))^r;
    return ((r^(r>>>14))>>>0)/4294967296; };
}
function isLetter(ch){ return !!ch && ((ch>='a'&&ch<='z')||(ch>='A'&&ch<='Z')); }

function encode(text, level, seed, zwProb, usc){
  let out='';
  for(let i=0;i<text.length;i++){
    const ch=text[i], rng=rngAt(seed,i);
    if(ch===' '){ out += usc ? '_' : ' '; continue; }
    const pool=poolFor(ch,level);
    if(pool){
      out += pool[Math.floor(rng()*pool.length)];
      if(isLetter(text[i+1])){
        const p=INWORD[level];
        if(p && rng()<p.prob) out += p.set[Math.floor(rng()*p.set.length)];
        if(zwProb>0 && rng()<zwProb) out += ZW[Math.floor(rng()*ZW.length)];
      }
      continue;
    }
    if(level===3 && PUNCT_VARIANT[ch]){ const v=PUNCT_VARIANT[ch]; out += v[Math.floor(rng()*v.length)]; }
    else out += ch;
  }
  return out;
}

/* ---------- wiring ---------- */
const $in=document.getElementById('in'), $out=document.getElementById('out'),
      $count=document.getElementById('incount'), $live=document.getElementById('live'),
      $usc=document.getElementById('usc'), $copy=document.getElementById('copy');
let level=3, seed=(Math.random()*1e9)|0, liveOn=true, zwProb=0, usc=false;

function render(){
  $out.textContent = encode($in.value, level, seed, zwProb, usc);
  $count.textContent = $in.value.length;
}
$in.addEventListener('input', ()=>{ $count.textContent=$in.value.length; if(liveOn) render(); });

document.querySelectorAll('[data-lvl]').forEach(b=>b.addEventListener('click',()=>{
  level=+b.dataset.lvl;
  document.querySelectorAll('[data-lvl]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  render();
}));
document.querySelectorAll('[data-zw]').forEach(b=>b.addEventListener('click',()=>{
  const v=+b.dataset.zw;
  if(zwProb===v){ zwProb=0; b.setAttribute('aria-pressed',false); }          // press active = off
  else { zwProb=v; document.querySelectorAll('[data-zw]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
  render();
}));
$live.addEventListener('click',()=>{ liveOn=!liveOn; $live.setAttribute('aria-pressed',liveOn); if(liveOn) render(); });
$usc.addEventListener('click',()=>{ usc=!usc; $usc.setAttribute('aria-pressed',usc); render(); });
document.getElementById('vary').addEventListener('click',()=>{ seed=(Math.random()*1e9)|0; render(); });
document.getElementById('encode').addEventListener('click', render);

$copy.addEventListener('click', async ()=>{
  const txt=$out.textContent; let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
  }
  const orig=$copy.textContent;
  $copy.textContent = ok ? 'Copied ✓' : 'Press & hold to copy';
  $copy.classList.toggle('copied', ok);
  setTimeout(()=>{ $copy.textContent=orig; $copy.classList.remove('copied'); },1400);
});

render();
</script>
</body>
</html>
