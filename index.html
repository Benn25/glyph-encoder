<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glyphbreak</title>
<style>
  :root{
    --bg:#0c0e14; --panel:#141823; --panel-2:#0f131c;
    --ink:#e8eaf0; --muted:#717a90; --line:#222838;
    --amber:#f2a65a; --amber-dim:#4a3a22; --teal:#5ad1c5; --teal-dim:#2c5650;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{padding:13px 18px 2px}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
  .brand h1 .b{color:var(--amber)}
  .brand .tag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
  main{flex:1;display:flex;flex-direction:column;gap:9px;padding:8px 14px 14px;min-height:0}

  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  textarea{flex:1;width:100%;resize:none;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;padding:12px;outline:none;min-height:56px}
  textarea:focus{border-color:var(--amber)}

  .out-wrap{position:relative;flex:1;min-height:84px}
  #out{height:100%;width:100%;border-radius:12px;border:1px solid var(--teal-dim);
    background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(90,209,197,.025) 3px,rgba(90,209,197,.025) 4px),var(--panel-2);
    color:var(--ink);font-family:var(--mono);font-size:17px;line-height:1.7;
    padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    box-shadow:inset 0 0 24px rgba(90,209,197,.05)}
  #out:empty::before{content:"encoded output appears here";color:var(--muted);font-style:italic}

  .srow{display:flex;gap:7px;align-items:stretch}
  .slider{flex:1;position:relative;height:44px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);overflow:hidden;cursor:ew-resize;touch-action:none;user-select:none}
  .slider:focus{outline:none;border-color:var(--ink)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--amber-dim)}
  .slider.teal .fill{background:var(--teal-dim)}
  .slabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 13px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.02em;
    color:var(--ink);pointer-events:none}
  .slabel .sval{color:var(--muted);font-weight:400}
  .dice{width:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-size:17px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
  .dice:active{transform:translateY(1px);color:var(--ink);border-color:var(--teal-dim)}

  .btn{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.03em;
    padding:13px 14px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#06201d;
    cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.copied{background:var(--amber);border-color:var(--amber);color:#1a1206}
  .hint{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;line-height:1.5;padding:1px 4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Glyph<span class="b">break</span></h1><span class="tag">// readable to you, noise to a model</span></div>
</header>

<main>
  <div class="field">
    <div class="label"><span>Plain text</span><span id="incount">0</span></div>
    <textarea id="in" placeholder="Type your message…" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
  </div>
  <div class="field">
    <div class="label"><span>Encoded</span></div>
    <div class="out-wrap"><div id="out"></div></div>
  </div>

  <div class="srow">
    <div class="slider" id="sl-str" role="slider" aria-label="Scramble" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="fill"></div><div class="slabel"><span>Scramble</span><span class="sval">65%</span></div>
    </div>
    <button class="dice" id="rnd-str" aria-label="Randomize scramble">⟳</button>
  </div>
  <div class="srow">
    <div class="slider teal" id="sl-pun" role="slider" aria-label="Punctuation" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="fill"></div><div class="slabel"><span>Punctuation</span><span class="sval">25%</span></div>
    </div>
    <button class="dice" id="rnd-pun" aria-label="Randomize punctuation">⟳</button>
  </div>
  <div class="srow">
    <div class="slider teal" id="sl-spl" role="slider" aria-label="Invisible splits" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="fill"></div><div class="slabel"><span>Invisible splits</span><span class="sval">50%</span></div>
    </div>
    <button class="dice" id="rnd-spl" aria-label="Randomize invisible splits">⟳</button>
  </div>
  <div class="srow">
    <div class="slider teal" id="sl-usc" role="slider" aria-label="Spaces to underscore" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="fill"></div><div class="slabel"><span>Spaces → _</span><span class="sval">0%</span></div>
    </div>
    <button class="dice" id="rnd-usc" aria-label="Randomize spaces to underscore">⟳</button>
  </div>

  <button class="btn" id="copy">Copy result</button>
  <div class="hint">Scramble survives normalization · punctuation &amp; splits survive NFKC but a serious filter can strip them · a frontier model may still read any of it.</div>
</main>

<script>
/* ---------- engine ---------- */
const ZW=['\u200B','\u200C','\u200D'];                 // zero-width space / non-joiner / joiner
const SEPSET=['\u00B7','\u2027','\u30FB','-'];          // · ‧ ・ -  (survive NFKC, break tokens)

function rngAt(seed,i){let t=(seed^(i*0x9E3779B1))>>>0;
  return function(){t|=0;t=(t+0x6D2B79F5)|0;let r=Math.imul(t^(t>>>15),1|t);
    r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296;};}

// pinned letters scale with length: <=6 -> 1/1, >6 -> 2 front, >8 -> 2 front + 2 back, then +1 every 2 letters
function anchors(len){
  const up=len<=6?0:Math.floor((len-7)/2)+1;
  let front=1+Math.ceil(up/2),back=1+Math.floor(up/2);
  while(len-front-back<2&&(front>1||back>1)){if(front>back)front--;else back--;}
  return {front,back};
}
function scrambleWord(word,seed,maxDist,intensity){
  const n=word.length;if(n<4)return word;
  const {front,back}=anchors(n);const midLen=n-front-back;if(midLen<2)return word;
  const mid=word.slice(front,n-back).split('');const home=mid.map((_,i)=>i);const r=rngAt(seed,3);
  for(let pass=0;pass<3;pass++){
    for(let i=0;i<midLen-1;i++){
      const d=1+Math.floor(r()*maxDist),j=i+d;if(j>=midLen)continue;
      if(r()<intensity&&Math.abs(home[i]-j)<=maxDist&&Math.abs(home[j]-i)<=maxDist){
        [mid[i],mid[j]]=[mid[j],mid[i]];[home[i],home[j]]=[home[j],home[i]];}
    }
  }
  let res=word.slice(0,front)+mid.join('')+word.slice(n-back);
  if(res===word){[mid[0],mid[1]]=[mid[1],mid[0]];res=word.slice(0,front)+mid.join('')+word.slice(n-back);}
  return res;
}
function doubleOne(word,seed){const r=rngAt(seed,2);const p=Math.floor(r()*word.length);
  return word.slice(0,p+1)+word[p]+word.slice(p+1);}
function isAZ(ch){return!!ch&&((ch>='a'&&ch<='z')||(ch>='A'&&ch<='Z'));}
function tokenize(text){const toks=[];let i=0;
  while(i<text.length){
    if(isAZ(text[i])){let j=i;while(j<text.length&&isAZ(text[j]))j++;toks.push({word:true,s:text.slice(i,j),start:i});i=j;}
    else{toks.push({word:false,s:text[i],start:i});i++;}
  }return toks;}

function encode(text,o){
  const t=o.strength, punct=o.punct, splits=o.splits, uscL=o.usc;
  const sStr=o.seedStr|0, sPun=o.seedPunct|0, sSpl=o.seedSpl|0, sUsc=o.seedUsc|0;
  const scrambleP=t, maxDist=(t<0.5?1:2), intensity=0.7*t, dblP=0.06*t;
  const punctProb=0.6*punct;
  const toks=tokenize(text); let out='', spaceIdx=0;
  for(let ti=0;ti<toks.length;ti++){
    const tok=toks[ti];
    if(!tok.word){
      if(tok.s===' '){ out += (rngAt(sUsc,spaceIdx)()<uscL)?'_':' '; spaceIdx++; }
      else out += tok.s;
      continue;
    }
    const closed=ti<toks.length-1; let w=tok.s;
    const wr=rngAt(sStr^0x55,tok.start);
    if(closed&&w.length>=4&&scrambleP>0&&wr()<scrambleP) w=scrambleWord(w,sStr^tok.start,maxDist,intensity);
    if(closed&&dblP>0&&wr()<dblP) w=doubleOne(w,sStr^(tok.start+7));
    for(let c=0;c<w.length;c++){
      out+=w[c];
      if(c<w.length-1){
        if(punctProb>0){const rp=rngAt(sPun,tok.start*131+c); if(rp()<punctProb) out+=SEPSET[Math.floor(rp()*SEPSET.length)];}
        if(splits>0){const rz=rngAt(sSpl,tok.start*131+c);let nz=0;
          if(rz()<splits)nz++; if(rz()<splits)nz++;
          for(let q=0;q<nz;q++) out+=ZW[Math.floor(rz()*ZW.length)];}
      }
    }
  }
  return out;
}

/* ---------- sliders ---------- */
function makeSlider(id, initial, onChange){
  const el=document.getElementById(id);
  const fill=el.querySelector('.fill'), valEl=el.querySelector('.sval');
  let val=initial, dragging=false;
  function set(v,silent){val=Math.max(0,Math.min(1,v));
    fill.style.width=(val*100)+'%'; valEl.textContent=Math.round(val*100)+'%';
    el.setAttribute('aria-valuenow',Math.round(val*100)); if(!silent) onChange(val);}
  function fromX(x){const r=el.getBoundingClientRect(); set((x-r.left)/r.width);}
  el.addEventListener('pointerdown',e=>{dragging=true;el.setPointerCapture(e.pointerId);fromX(e.clientX);e.preventDefault();});
  el.addEventListener('pointermove',e=>{if(dragging)fromX(e.clientX);});
  el.addEventListener('pointerup',()=>{dragging=false;});
  el.addEventListener('pointercancel',()=>{dragging=false;});
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){set(val+0.02);e.preventDefault();}
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){set(val-0.02);e.preventDefault();}});
  set(initial,true);
  return {get:()=>val};
}

/* ---------- wiring ---------- */
const $in=document.getElementById('in'),$out=document.getElementById('out'),
  $count=document.getElementById('incount'),$copy=document.getElementById('copy');
const rnd=()=>(Math.random()*1e9)|0;
let seedStr=rnd(), seedPunct=rnd(), seedSpl=rnd(), seedUsc=rnd();

function render(){
  $out.textContent=encode($in.value,{
    strength:str.get(), punct:pun.get(), splits:spl.get(), usc:usc.get(),
    seedStr, seedPunct, seedSpl, seedUsc});
  $count.textContent=$in.value.length;
}
const str=makeSlider('sl-str',0.65,render);
const pun=makeSlider('sl-pun',0.25,render);
const spl=makeSlider('sl-spl',0.50,render);
const usc=makeSlider('sl-usc',0.00,render);

document.getElementById('rnd-str').addEventListener('click',()=>{seedStr=rnd();render();});
document.getElementById('rnd-pun').addEventListener('click',()=>{seedPunct=rnd();render();});
document.getElementById('rnd-spl').addEventListener('click',()=>{seedSpl=rnd();render();});
document.getElementById('rnd-usc').addEventListener('click',()=>{seedUsc=rnd();render();});
$in.addEventListener('input',render);

$copy.addEventListener('click',async()=>{const txt=$out.textContent;let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true;}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy');}catch(_){}document.body.removeChild(ta);}
  const orig=$copy.textContent;$copy.textContent=ok?'Copied ✓':'Press & hold to copy';
  $copy.classList.toggle('copied',ok);setTimeout(()=>{$copy.textContent=orig;$copy.classList.remove('copied');},1400);});

render();
</script>
</body>
</html>
